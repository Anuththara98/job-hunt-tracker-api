spring.application.name=job-hunt-tracker-api

spring.datasource.url=jdbc:mysql://localhost:3306/job_hunt_tracker_db
spring.datasource.username=root
spring.datasource.password=admin123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

app.anthropic.api-key=${ANTHROPIC_API_KEY}
app.anthropic.model=${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
app.anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:1024}